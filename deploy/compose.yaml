name: jims-production
x-app: &app
  image: ${JIMS_APP_IMAGE:?Set a versioned application image}
  env_file: .env
  restart: unless-stopped
  init: true
  volumes:
    - app-storage:/var/www/html/storage
  networks: [backend]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'
  depends_on:
    db:
      condition: service_healthy
services:
  web:
    image: ${JIMS_WEB_IMAGE:?Set a versioned web image}
    restart: unless-stopped
    networks:
      backend:
      ingress:
        aliases: [jims-web]
    depends_on: [app, reverb]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/up']
      interval: 30s
      timeout: 5s
      retries: 3
  app:
    <<: *app
  queue:
    <<: *app
    networks: [backend, outbound]
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=60
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jims}
      POSTGRES_USER: ${DB_USERNAME:-jims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a private database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
  app-storage:
networks:
  backend:
    internal: true
  outbound:
  ingress:
    external: true
    name: jims-ingress
